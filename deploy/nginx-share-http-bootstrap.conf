# Temporary HTTP-only vhost so certbot can issue share.example.com.
# Replace with nginx-share.conf after the cert exists.

server {
    listen 80;
    listen [::]:80;
    server_name share.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/acme;
        allow all;
    }

    location / {
        return 200 "ezscreenshare cert bootstrap\n";
        add_header Content-Type text/plain;
    }
}
