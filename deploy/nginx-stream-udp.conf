# Do not proxy LiveKit's UDP port. nginx stream workers share one socket unless
# the process is fully restarted after `reuseport`, and even then each viewer
# is a separate flow that the kernel may split. A split flow shows up as audio
# dropouts, a bitrate collapse, and a ping that flips to 0 when ICE reselects.
# Bind rtc.udp_port on the same host as node_ip instead.
