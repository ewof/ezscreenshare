# Production API on the home server. LiveKit itself runs on the VPS that owns
# the public IP (deploy/livekit-vps.compose.yml). Proxying its UDP port through
# nginx splits each WebRTC flow across workers and fans every viewer back out
# the home uplink.
#
#   docker compose -f docker-compose.prod.yml up
services:
  api:
    build: .
    container_name: ezscreenshare-api
    restart: unless-stopped
    network_mode: host
    env_file: .env.prod
    volumes:
      - ./.env.prod:/app/.env.prod:ro
