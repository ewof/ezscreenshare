appId: com.example.ezscreenshare
productName: ezscreenshare
copyright: FOSS
# ESM main (src/main/electron.mjs) cannot load from asar.
asar: false
directories:
  output: dist/desktop
files:
  - src/main/**
  - src/preload/**
  - src/shared/**
  - package.json
  - "!**/node_modules/**"
extraMetadata:
  main: src/main/electron.mjs
linux:
  executableName: ezscreenshare
  category: Network
  maintainer: ezscreenshare
  artifactName: ${productName}-${version}-${os}-${arch}.${ext}
  target:
    - dir
    - zip
    - AppImage
win:
  target: nsis
  extraResources:
    - from: dist/native/windows-audio.exe
      to: native/windows-audio.exe
    - from: dist/native/windows-desktops.exe
      to: native/windows-desktops.exe
mac:
  target: dmg
  category: public.app-category.video
  extendInfo:
    NSAudioCaptureUsageDescription: Share audio from the applications you select.
    NSScreenCaptureUsageDescription: Share the screen or window you select.
  extraResources:
    - from: dist/native/macos-audio
      to: native/macos-audio
